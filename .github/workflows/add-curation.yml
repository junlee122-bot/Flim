name: Add curation (auto)

# 30분마다 대기열에서 아직 없는 큐레이션 1개를 추가한다.
# 대기열이 모두 소진되면 스크립트가 스스로 아무 것도 하지 않고 종료한다.
on:
  schedule:
    - cron: "*/30 * * * *" # 매 30분 (UTC 기준, GitHub는 수 분 지연될 수 있음)
  workflow_dispatch: {} # 수동 실행 버튼

# 동시 실행 방지 (겹치면 중복 시도 방지)
concurrency:
  group: add-curation
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Add next curation
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/add-next-curation.mjs
